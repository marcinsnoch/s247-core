[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s247-core"
version = "0.1.0"
description = "Backend REST API dla platformy obsługi zgłoszeń i diagnostyki technicznej s247"
readme = "README.md"
authors = [
    {name = "s247 Team"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "aio-pika>=9.4.0",
    "bcrypt>=4.2.0",
    "python-jose[cryptography]>=3.3.0",
    "starlette>=0.38.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
